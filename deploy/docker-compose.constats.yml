# Projet Docker Compose « app-constats » du VPS Hostinger (VM 1102696).
# Projet SÉPARÉ du projet « root » (Traefik + n8n + Suivi PENA) : le déployer
# ou le supprimer ne touche jamais Suivi PENA. Il se branche sur le réseau
# du projet root pour que Traefik (HTTPS Let's Encrypt) le serve.
#
# hPanel → VPS → Docker Manager → projet app-constats → modifier ce fichier, Déployer.
# Prérequis : paquet GHCR app-constats en visibilité publique (sinon « pull access denied »).
#
# Les secrets ne sont JAMAIS écrits ici : les renseigner dans les variables d'environnement
# du projet (hPanel, onglet .env / Variables d'environnement). Voir docs/ACCES_ET_INSTALLATION.md.
services:
  constats-app:
    image: ghcr.io/christel-cdl/app-constats:latest
    restart: always
    environment:
      APP_URL: ${APP_URL}                      # https://app.expertform.fr
      SESSION_SECRET: ${SESSION_SECRET}        # 64 caractères aléatoires, ne jamais changer sans raison
      AIRTABLE_TOKEN: ${AIRTABLE_TOKEN}        # jeton personnel Airtable, base CONSTATS uniquement
      AIRTABLE_BASE_ID: ${AIRTABLE_BASE_ID}
      AIRTABLE_USERS_TABLE: Utilisateurs
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}                  # ex. "Constats CDL EXPERT <connexion@expertform.fr>"
    volumes:
      - constats-data:/data                    # constats et photos sauvegardés : NE PAS supprimer ce volume
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      # app.expertform.fr (adresse définitive) ; l'ancienne adresse reste servie pendant la transition.
      - "traefik.http.routers.constats-app.rule=Host(`app.expertform.fr`) || Host(`constats.srv1102696.hstgr.cloud`)"
      - "traefik.http.routers.constats-app.entrypoints=web,websecure"
      - "traefik.http.routers.constats-app.tls=true"
      - "traefik.http.routers.constats-app.tls.certresolver=mytlschallenge"
      - "traefik.http.services.constats-app.loadbalancer.server.port=8080"

volumes:
  constats-data:

networks:
  root_default:
    external: true
